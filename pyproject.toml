[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-timetable"
version = "0.1.0"
description = "Constraint-based academic timetable management and optimization backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "ortools>=9.11",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

